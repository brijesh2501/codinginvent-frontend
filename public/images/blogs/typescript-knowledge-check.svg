<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- TS logo shape -->
  <g transform="translate(400,170)">
    <rect x="-120" y="-90" width="240" height="180" rx="20" fill="#3178c6" opacity="0.12" stroke="#3178c6" stroke-width="2.5"/>
    <text y="-20" text-anchor="middle" fill="#3178c6" font-family="system-ui,sans-serif" font-size="80" font-weight="900">TS</text>
    <text y="30" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="14">Knowledge Check</text>
  </g>
  <!-- Floating type annotations -->
  <g fill="#64748b" font-family="monospace" font-size="12" opacity="0.5">
    <text x="60" y="80">string</text>
    <text x="650" y="100">number</text>
    <text x="100" y="320">interface</text>
    <text x="600" y="330">generic&lt;T&gt;</text>
    <text x="50" y="200">type</text>
    <text x="680" y="220">enum</text>
    <text x="160" y="370">keyof</text>
    <text x="550" y="60">readonly</text>
  </g>
  <!-- Checkmark hints -->
  <g fill="#22c55e" font-family="system-ui,sans-serif" font-size="16" opacity="0.4">
    <text x="90" y="140">✓</text>
    <text x="680" y="170">✓</text>
    <text x="70" y="270">✓</text>
    <text x="700" y="290">✓</text>
  </g>
  <circle cx="400" cy="170" r="160" fill="#3178c6" opacity="0.03"/>
</svg>
