<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Accordion shape -->
  <g transform="translate(400,185)">
    <!-- Expanded item -->
    <rect x="-160" y="-110" width="320" height="50" rx="10" fill="#7c3aed" opacity="0.15" stroke="#7c3aed" stroke-width="2"/>
    <text x="-140" y="-78" fill="#a78bfa" font-family="system-ui,sans-serif" font-size="14" font-weight="700">▼  Section One</text>
    <!-- Expanded content -->
    <rect x="-160" y="-55" width="320" height="50" rx="0" fill="#7c3aed" opacity="0.06"/>
    <text x="-140" y="-28" fill="#94a3b8" font-family="monospace" font-size="11">Expanded content goes here...</text>
    <text x="-140" y="-10" fill="#64748b" font-family="monospace" font-size="11">Supports any React children</text>
    <!-- Collapsed items -->
    <rect x="-160" y="5" width="320" height="42" rx="10" fill="#3b82f6" opacity="0.1" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="-140" y="32" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="14" font-weight="600">▶  Section Two</text>
    <rect x="-160" y="55" width="320" height="42" rx="10" fill="#3b82f6" opacity="0.08" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="-140" y="82" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="14" font-weight="600">▶  Section Three</text>
    <!-- Code hint -->
    <text x="0" y="130" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="13">&lt;Accordion&gt; — Generic &amp; Reusable</text>
  </g>
  <!-- React logo hint -->
  <circle cx="680" cy="80" r="25" fill="none" stroke="#61dafb" stroke-width="1.5" opacity="0.3"/>
  <circle cx="680" cy="80" r="4" fill="#61dafb" opacity="0.4"/>
  <circle cx="400" cy="185" r="160" fill="#7c3aed" opacity="0.02"/>
</svg>
