<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#glow)"/>
  <!-- Agentic loop -->
  <g transform="translate(400,180)">
    <!-- Central agent node -->
    <circle cx="0" cy="0" r="45" fill="#a855f7" opacity="0.1" stroke="#a855f7" stroke-width="2.5"/>
    <text y="-5" text-anchor="middle" fill="#a855f7" font-family="system-ui,sans-serif" font-size="28">🤖</text>
    <text y="20" text-anchor="middle" fill="#a855f7" font-family="monospace" font-size="10" font-weight="700">AGENT</text>
    <!-- Orbiting tools -->
    <g>
      <circle cx="-140" cy="-60" r="28" fill="#3b82f6" opacity="0.1" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="-140" y="-55" text-anchor="middle" fill="#3b82f6" font-family="monospace" font-size="9" font-weight="700">Code</text>
      <text x="-140" y="-42" text-anchor="middle" fill="#3b82f6" font-family="monospace" font-size="8">Review</text>

      <circle cx="140" cy="-60" r="28" fill="#ef4444" opacity="0.1" stroke="#ef4444" stroke-width="1.5"/>
      <text x="140" y="-55" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="9" font-weight="700">Incident</text>
      <text x="140" y="-42" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="8">Response</text>

      <circle cx="-160" cy="50" r="28" fill="#22c55e" opacity="0.1" stroke="#22c55e" stroke-width="1.5"/>
      <text x="-160" y="45" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="9" font-weight="700">Test</text>
      <text x="-160" y="58" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="8">Gen</text>

      <circle cx="160" cy="50" r="28" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="160" y="45" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="9" font-weight="700">Docs</text>
      <text x="160" y="58" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="8">Agent</text>

      <circle cx="0" cy="100" r="28" fill="#38bdf8" opacity="0.1" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="0" y="95" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="700">Ticket</text>
      <text x="0" y="108" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="8">Grooming</text>
    </g>
    <!-- Connecting lines -->
    <g stroke="#475569" stroke-width="0.8" stroke-dasharray="4" opacity="0.4">
      <line x1="-45" y1="-20" x2="-112" y2="-48"/>
      <line x1="45" y1="-20" x2="112" y2="-48"/>
      <line x1="-45" y1="20" x2="-132" y2="40"/>
      <line x1="45" y1="20" x2="132" y2="40"/>
      <line x1="0" y1="45" x2="0" y2="72"/>
    </g>
    <!-- Title -->
    <text y="-130" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="18" font-weight="800">Automate Repetitive IT Work</text>
    <text y="-110" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13">with Agentic AI</text>
  </g>
</svg>
