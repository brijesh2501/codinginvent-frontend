<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Object creation patterns -->
  <g transform="translate(400,185)">
    <!-- Constructor -->
    <g transform="translate(-200,-60)">
      <rect x="-80" y="-30" width="160" height="60" rx="10" fill="#3b82f6" opacity="0.1" stroke="#3b82f6" stroke-width="2"/>
      <text y="8" text-anchor="middle" fill="#3b82f6" font-family="monospace" font-size="13" font-weight="700">new Person()</text>
    </g>
    <!-- Object.create -->
    <g transform="translate(0,-60)">
      <rect x="-80" y="-30" width="160" height="60" rx="10" fill="#22c55e" opacity="0.1" stroke="#22c55e" stroke-width="2"/>
      <text y="8" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="13" font-weight="700">Object.create()</text>
    </g>
    <!-- Class -->
    <g transform="translate(200,-60)">
      <rect x="-80" y="-30" width="160" height="60" rx="10" fill="#a855f7" opacity="0.1" stroke="#a855f7" stroke-width="2"/>
      <text y="8" text-anchor="middle" fill="#a855f7" font-family="monospace" font-size="13" font-weight="700">class Person</text>
    </g>
    <!-- Arrows down to prototype chain -->
    <line x1="-200" y1="35" x2="-200" y2="65" stroke="#475569" stroke-width="1" stroke-dasharray="4"/>
    <line x1="0" y1="35" x2="0" y2="65" stroke="#475569" stroke-width="1" stroke-dasharray="4"/>
    <line x1="200" y1="35" x2="200" y2="65" stroke="#475569" stroke-width="1" stroke-dasharray="4"/>
    <!-- Prototype chain -->
    <rect x="-280" y="65" width="560" height="50" rx="12" fill="#eab308" opacity="0.08" stroke="#eab308" stroke-width="1.5"/>
    <text y="97" text-anchor="middle" fill="#eab308" font-family="monospace" font-size="14" font-weight="700">__proto__  →  Prototype Chain  →  Object.prototype  →  null</text>
    <!-- Factory -->
    <g transform="translate(-200,60)">
      <rect x="-80" y="80" width="160" height="50" rx="10" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/>
      <text y="112" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="700">Factory Function</text>
    </g>
    <!-- Literal -->
    <g transform="translate(200,60)">
      <rect x="-80" y="80" width="160" height="50" rx="10" fill="#ef4444" opacity="0.1" stroke="#ef4444" stroke-width="1.5"/>
      <text y="112" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="12" font-weight="700">{ literal }</text>
    </g>
  </g>
  <circle cx="400" cy="185" r="170" fill="#eab308" opacity="0.02"/>
</svg>
