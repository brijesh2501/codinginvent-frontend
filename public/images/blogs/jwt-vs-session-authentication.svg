<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- JWT Token -->
  <g transform="translate(220,195)">
    <rect x="-100" y="-80" width="200" height="55" rx="8" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="1.5"/>
    <text y="-45" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="13" font-weight="700">Header</text>
    <rect x="-100" y="-18" width="200" height="55" rx="8" fill="#a855f7" opacity="0.15" stroke="#a855f7" stroke-width="1.5"/>
    <text y="17" text-anchor="middle" fill="#a855f7" font-family="monospace" font-size="13" font-weight="700">Payload</text>
    <rect x="-100" y="44" width="200" height="55" rx="8" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
    <text y="79" text-anchor="middle" fill="#3b82f6" font-family="monospace" font-size="13" font-weight="700">Signature</text>
    <text y="130" text-anchor="middle" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="22" font-weight="800">JWT</text>
  </g>
  <!-- VS -->
  <text x="400" y="202" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="30" font-weight="800">VS</text>
  <!-- Session — server + cookie -->
  <g transform="translate(580,175)">
    <rect x="-80" y="-70" width="160" height="80" rx="12" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.8"/>
    <text y="-35" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="13" font-weight="700">Server</text>
    <text y="-12" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">session_store = {}</text>
    <!-- Arrow down -->
    <line x1="0" y1="15" x2="0" y2="45" stroke="#475569" stroke-width="1.5" stroke-dasharray="4"/>
    <text y="42" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="10">cookie</text>
    <!-- Browser -->
    <rect x="-60" y="50" width="120" height="50" rx="8" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.7"/>
    <text y="82" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="12">🌐 Browser</text>
    <text y="140" text-anchor="middle" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="22" font-weight="800">Session</text>
  </g>
  <!-- Lock icon center top -->
  <text x="400" y="55" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="40">🔐</text>
  <circle cx="220" cy="195" r="130" fill="#ef4444" opacity="0.02"/>
  <circle cx="580" cy="195" r="130" fill="#22c55e" opacity="0.02"/>
</svg>
