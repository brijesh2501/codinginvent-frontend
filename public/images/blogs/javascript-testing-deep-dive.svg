<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Test pyramid -->
  <g transform="translate(400,200)">
    <!-- Bottom — Unit -->
    <polygon points="-180,80 180,80 120,20 -120,20" fill="#22c55e" opacity="0.12" stroke="#22c55e" stroke-width="2"/>
    <text y="60" text-anchor="middle" fill="#22c55e" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Unit Tests</text>
    <!-- Middle — Integration -->
    <polygon points="-120,20 120,20 70,-35 -70,-35" fill="#f59e0b" opacity="0.12" stroke="#f59e0b" stroke-width="2"/>
    <text y="0" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Integration</text>
    <!-- Top — E2E -->
    <polygon points="-70,-35 70,-35 0,-90" fill="#ef4444" opacity="0.12" stroke="#ef4444" stroke-width="2"/>
    <text y="-55" text-anchor="middle" fill="#ef4444" font-family="system-ui,sans-serif" font-size="13" font-weight="700">E2E</text>
    <!-- Tool labels -->
    <text x="-220" y="58" fill="#64748b" font-family="monospace" font-size="11">Jest</text>
    <text x="195" y="58" fill="#64748b" font-family="monospace" font-size="11">Vitest</text>
    <text x="-180" y="-2" fill="#64748b" font-family="monospace" font-size="11">RTL</text>
    <text x="140" y="-2" fill="#64748b" font-family="monospace" font-size="11">MSW</text>
    <text x="-130" y="-55" fill="#64748b" font-family="monospace" font-size="11">Cypress</text>
    <text x="80" y="-55" fill="#64748b" font-family="monospace" font-size="11">Playwright</text>
  </g>
  <!-- Test icon -->
  <text x="400" y="345" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="14">🧪 The Testing Pyramid</text>
  <circle cx="400" cy="200" r="160" fill="#22c55e" opacity="0.02"/>
</svg>
