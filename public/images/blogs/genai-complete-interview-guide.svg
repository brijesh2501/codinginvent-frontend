<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1a0536"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#glow)"/>
  <!-- Neural network nodes -->
  <g transform="translate(400,190)">
    <!-- Brain silhouette via circles -->
    <circle cx="0" cy="-20" r="80" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.3"/>
    <circle cx="-30" cy="-40" r="40" fill="none" stroke="#ec4899" stroke-width="1" opacity="0.2"/>
    <circle cx="30" cy="-40" r="40" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.2"/>
    <!-- Network connections -->
    <g stroke="#a855f7" stroke-width="0.8" opacity="0.25">
      <line x1="-60" y1="-60" x2="-20" y2="-20"/>
      <line x1="-40" y1="-70" x2="10" y2="-30"/>
      <line x1="60" y1="-60" x2="20" y2="-20"/>
      <line x1="40" y1="-70" x2="-10" y2="-30"/>
      <line x1="-20" y1="-20" x2="20" y2="-20"/>
      <line x1="0" y1="-50" x2="0" y2="10"/>
    </g>
    <!-- Nodes -->
    <circle cx="-60" cy="-60" r="5" fill="#ec4899" opacity="0.6"/>
    <circle cx="-40" cy="-70" r="4" fill="#a855f7" opacity="0.5"/>
    <circle cx="60" cy="-60" r="5" fill="#ec4899" opacity="0.6"/>
    <circle cx="40" cy="-70" r="4" fill="#a855f7" opacity="0.5"/>
    <circle cx="-20" cy="-20" r="6" fill="#8b5cf6" opacity="0.7"/>
    <circle cx="20" cy="-20" r="6" fill="#8b5cf6" opacity="0.7"/>
    <circle cx="0" cy="10" r="7" fill="#a855f7" opacity="0.8"/>
    <!-- Topics around -->
    <text x="-250" y="-50" fill="#64748b" font-family="monospace" font-size="11">LLMs</text>
    <text x="-260" y="0" fill="#64748b" font-family="monospace" font-size="11">Transformers</text>
    <text x="-240" y="50" fill="#64748b" font-family="monospace" font-size="11">RAG</text>
    <text x="190" y="-50" fill="#64748b" font-family="monospace" font-size="11">Prompt Eng.</text>
    <text x="190" y="0" fill="#64748b" font-family="monospace" font-size="11">Fine-tuning</text>
    <text x="190" y="50" fill="#64748b" font-family="monospace" font-size="11">Agents</text>
    <!-- Title -->
    <text y="120" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="20" font-weight="800">GenAI Interview Guide</text>
    <text y="145" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13">100+ Questions • Deep Concepts</text>
  </g>
</svg>
