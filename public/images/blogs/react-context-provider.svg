<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Context Provider tree -->
  <g transform="translate(400,195)">
    <!-- Provider box -->
    <rect x="-170" y="-120" width="340" height="50" rx="12" fill="#61dafb" opacity="0.12" stroke="#61dafb" stroke-width="2"/>
    <text y="-88" text-anchor="middle" fill="#61dafb" font-family="monospace" font-size="15" font-weight="700">&lt;ThemeContext.Provider&gt;</text>
    <!-- Tree lines -->
    <line x1="0" y1="-70" x2="-120" y2="-30" stroke="#475569" stroke-width="1.5"/>
    <line x1="0" y1="-70" x2="0" y2="-30" stroke="#475569" stroke-width="1.5"/>
    <line x1="0" y1="-70" x2="120" y2="-30" stroke="#475569" stroke-width="1.5"/>
    <!-- Child components -->
    <rect x="-165" y="-30" width="90" height="40" rx="8" fill="#22c55e" opacity="0.1" stroke="#22c55e" stroke-width="1.5"/>
    <text x="-120" y="-4" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="11">&lt;Header/&gt;</text>
    <rect x="-45" y="-30" width="90" height="40" rx="8" fill="#a78bfa" opacity="0.1" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="11">&lt;Main/&gt;</text>
    <rect x="75" y="-30" width="90" height="40" rx="8" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="120" y="-4" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="11">&lt;Footer/&gt;</text>
    <!-- useContext arrows -->
    <line x1="-120" y1="15" x2="-120" y2="55" stroke="#22c55e" stroke-width="1" stroke-dasharray="4"/>
    <line x1="0" y1="15" x2="0" y2="55" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4"/>
    <line x1="120" y1="15" x2="120" y2="55" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4"/>
    <text x="-120" y="72" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="10">useContext()</text>
    <text x="0" y="72" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="10">useContext()</text>
    <text x="120" y="72" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="10">useContext()</text>
    <!-- Label -->
    <text y="120" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">No prop drilling — shared state everywhere</text>
  </g>
  <circle cx="400" cy="195" r="180" fill="#61dafb" opacity="0.02"/>
</svg>
