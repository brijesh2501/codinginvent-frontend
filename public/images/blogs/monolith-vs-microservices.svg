<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Monolith — single big block -->
  <g transform="translate(220,195)">
    <rect x="-100" y="-100" width="200" height="200" rx="16" fill="none" stroke="#8b5cf6" stroke-width="2.5" opacity="0.85"/>
    <rect x="-85" y="-85" width="170" height="40" rx="6" fill="#8b5cf6" opacity="0.12"/>
    <text y="-58" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="12">Auth Module</text>
    <rect x="-85" y="-35" width="170" height="40" rx="6" fill="#8b5cf6" opacity="0.08"/>
    <text y="-8" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="12">Orders Module</text>
    <rect x="-85" y="15" width="170" height="40" rx="6" fill="#8b5cf6" opacity="0.06"/>
    <text y="42" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="12">Payments Module</text>
    <rect x="-85" y="65" width="170" height="25" rx="6" fill="#8b5cf6" opacity="0.04"/>
    <text y="83" text-anchor="middle" fill="#7c3aed" font-family="monospace" font-size="10">Single DB</text>
    <text y="135" text-anchor="middle" fill="#8b5cf6" font-family="system-ui,sans-serif" font-size="20" font-weight="700">Monolith</text>
  </g>
  <!-- VS -->
  <text x="400" y="202" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="30" font-weight="800">VS</text>
  <!-- Microservices — separate boxes -->
  <g transform="translate(580,140)">
    <rect x="-55" y="-45" width="110" height="50" rx="10" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.8"/>
    <text y="-14" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="12">Auth Svc</text>
  </g>
  <g transform="translate(580,215)">
    <rect x="-55" y="-25" width="110" height="50" rx="10" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
    <text y="6" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12">Orders Svc</text>
  </g>
  <g transform="translate(580,290)">
    <rect x="-55" y="-25" width="110" height="50" rx="10" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.8"/>
    <text y="6" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="12">Pay Svc</text>
  </g>
  <!-- Connecting lines -->
  <line x1="580" y1="120" x2="580" y2="165" stroke="#475569" stroke-width="1" stroke-dasharray="4"/>
  <line x1="580" y1="215" x2="580" y2="240" stroke="#475569" stroke-width="1" stroke-dasharray="4"/>
  <text x="580" y="345" text-anchor="middle" fill="#22c55e" font-family="system-ui,sans-serif" font-size="20" font-weight="700">Microservices</text>
  <!-- Glows -->
  <circle cx="220" cy="195" r="130" fill="#8b5cf6" opacity="0.03"/>
  <circle cx="580" cy="210" r="130" fill="#22c55e" opacity="0.03"/>
</svg>
