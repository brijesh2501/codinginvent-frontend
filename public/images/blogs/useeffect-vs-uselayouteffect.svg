<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- useEffect timeline -->
  <g transform="translate(200,160)">
    <rect x="-120" y="-60" width="240" height="120" rx="14" fill="#38bdf8" opacity="0.1" stroke="#38bdf8" stroke-width="2"/>
    <text y="-25" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="17" font-weight="700">useEffect</text>
    <text y="5" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">Runs AFTER paint</text>
    <text y="25" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">Non-blocking</text>
    <text y="45" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="12" font-weight="600">⚡ Async-friendly</text>
  </g>
  <!-- VS -->
  <text x="400" y="168" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="28" font-weight="800">VS</text>
  <!-- useLayoutEffect timeline -->
  <g transform="translate(600,160)">
    <rect x="-120" y="-60" width="240" height="120" rx="14" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="2"/>
    <text y="-25" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="17" font-weight="700">useLayoutEffect</text>
    <text y="5" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">Runs BEFORE paint</text>
    <text y="25" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">Synchronous</text>
    <text y="45" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="12" font-weight="600">⏱ Blocks render</text>
  </g>
  <!-- Timeline bar -->
  <g transform="translate(100,310)">
    <line x1="0" y1="0" x2="600" y2="0" stroke="#475569" stroke-width="2"/>
    <circle cx="100" cy="0" r="6" fill="#f59e0b"/>
    <text x="100" y="25" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="10">Layout</text>
    <circle cx="300" cy="0" r="6" fill="#94a3b8"/>
    <text x="300" y="25" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Paint</text>
    <circle cx="500" cy="0" r="6" fill="#38bdf8"/>
    <text x="500" y="25" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10">Effect</text>
    <text x="0" y="-15" fill="#64748b" font-family="monospace" font-size="10">Render →</text>
  </g>
  <circle cx="200" cy="160" r="100" fill="#38bdf8" opacity="0.02"/>
  <circle cx="600" cy="160" r="100" fill="#f59e0b" opacity="0.02"/>
</svg>
