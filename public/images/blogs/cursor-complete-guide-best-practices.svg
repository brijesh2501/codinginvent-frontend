<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Cursor editor shape -->
  <g transform="translate(400,180)">
    <!-- Editor window frame -->
    <rect x="-200" y="-100" width="400" height="200" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <!-- Title bar -->
    <rect x="-200" y="-100" width="400" height="30" rx="12" fill="#334155"/>
    <rect x="-200" y="-82" width="400" height="12" fill="#334155"/>
    <circle cx="-180" cy="-85" r="5" fill="#ef4444" opacity="0.7"/>
    <circle cx="-164" cy="-85" r="5" fill="#f59e0b" opacity="0.7"/>
    <circle cx="-148" cy="-85" r="5" fill="#22c55e" opacity="0.7"/>
    <text x="0" y="-80" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">Cursor — AI Code Editor</text>
    <!-- Code lines -->
    <rect x="-180" y="-55" width="120" height="8" rx="3" fill="#64748b" opacity="0.4"/>
    <rect x="-180" y="-40" width="90" height="8" rx="3" fill="#64748b" opacity="0.3"/>
    <rect x="-180" y="-25" width="150" height="8" rx="3" fill="#64748b" opacity="0.4"/>
    <!-- AI inline suggestion highlighted -->
    <rect x="-180" y="-5" width="340" height="35" rx="6" fill="#a855f7" opacity="0.08" stroke="#a855f7" stroke-width="1" stroke-dasharray="3"/>
    <rect x="-170" y="5" width="200" height="8" rx="3" fill="#a855f7" opacity="0.4"/>
    <rect x="-170" y="18" width="140" height="8" rx="3" fill="#a855f7" opacity="0.3"/>
    <!-- More code -->
    <rect x="-180" y="42" width="100" height="8" rx="3" fill="#64748b" opacity="0.3"/>
    <rect x="-180" y="57" width="130" height="8" rx="3" fill="#64748b" opacity="0.4"/>
    <!-- Chat sidebar hint -->
    <line x1="120" y1="-65" x2="120" y2="80" stroke="#475569" stroke-width="0.5"/>
    <text x="160" y="-45" text-anchor="middle" fill="#a855f7" font-family="system-ui,sans-serif" font-size="10" font-weight="700">AI Chat</text>
    <rect x="130" y="-35" width="55" height="5" rx="2" fill="#a855f7" opacity="0.2"/>
    <rect x="130" y="-25" width="45" height="5" rx="2" fill="#a855f7" opacity="0.15"/>
    <rect x="130" y="-15" width="50" height="5" rx="2" fill="#a855f7" opacity="0.2"/>
    <!-- Label -->
    <text y="140" text-anchor="middle" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="22" font-weight="800">Cursor AI</text>
  </g>
  <circle cx="400" cy="180" r="160" fill="#a855f7" opacity="0.02"/>
</svg>
