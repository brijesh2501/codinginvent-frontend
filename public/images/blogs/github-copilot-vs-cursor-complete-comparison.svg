<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Copilot side -->
  <g transform="translate(220,175)">
    <rect x="-100" y="-70" width="200" height="140" rx="14" fill="#38bdf8" opacity="0.08" stroke="#38bdf8" stroke-width="2"/>
    <text y="-35" text-anchor="middle" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="18" font-weight="800">Copilot</text>
    <text y="-10" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">IDE Extension</text>
    <text y="10" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">Inline Completion</text>
    <text y="30" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">Chat Panel</text>
    <text y="50" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600">$10-19/mo</text>
  </g>
  <!-- VS battle -->
  <g transform="translate(400,175)">
    <text y="8" text-anchor="middle" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="36" font-weight="900">⚔️</text>
  </g>
  <!-- Cursor side -->
  <g transform="translate(580,175)">
    <rect x="-100" y="-70" width="200" height="140" rx="14" fill="#a855f7" opacity="0.08" stroke="#a855f7" stroke-width="2"/>
    <text y="-35" text-anchor="middle" fill="#a855f7" font-family="system-ui,sans-serif" font-size="18" font-weight="800">Cursor</text>
    <text y="-10" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">Full AI Editor</text>
    <text y="10" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">Multi-file Edits</text>
    <text y="30" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">Composer Mode</text>
    <text y="50" text-anchor="middle" fill="#a855f7" font-family="monospace" font-size="11" font-weight="600">$20/mo</text>
  </g>
  <!-- Comparison metrics -->
  <g transform="translate(400,330)">
    <text y="0" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13">Which AI coding tool is right for you?</text>
  </g>
  <circle cx="220" cy="175" r="120" fill="#38bdf8" opacity="0.02"/>
  <circle cx="580" cy="175" r="120" fill="#a855f7" opacity="0.02"/>
</svg>
