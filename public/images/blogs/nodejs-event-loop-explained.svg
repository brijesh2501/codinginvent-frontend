<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="node-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#68a063"/>
      <stop offset="100%" stop-color="#3c873a"/>
    </linearGradient>
    <linearGradient id="loop-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7df1e"/>
      <stop offset="100%" stop-color="#f0c040"/>
    </linearGradient>
    <linearGradient id="queue-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#68a063" stroke-width="0.5">
    <line x1="0" y1="0" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="800" y2="300"/>
    <line x1="0" y1="100" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="0" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
  </g>
  <!-- Node.js hexagon logo -->
  <g transform="translate(130,170)">
    <polygon points="0,-65 56,-32 56,32 0,65 -56,32 -56,-32" fill="none" stroke="url(#node-g)" stroke-width="3" opacity="0.9"/>
    <text y="5" text-anchor="middle" fill="#68a063" font-family="system-ui,sans-serif" font-size="20" font-weight="800">N</text>
    <text y="105" text-anchor="middle" fill="#68a063" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Node.js</text>
  </g>
  <!-- Event Loop circle -->
  <g transform="translate(400,170)">
    <circle cx="0" cy="0" r="68" fill="none" stroke="url(#loop-g)" stroke-width="3" stroke-dasharray="12 6" opacity="0.85"/>
    <!-- Rotating arrows -->
    <path d="M48,-48 A68,68 0 0,1 68,0" fill="none" stroke="#f7df1e" stroke-width="2.5" marker-end="url(#arrowY)"/>
    <path d="M-48,48 A68,68 0 0,1 -68,0" fill="none" stroke="#f7df1e" stroke-width="2.5" marker-end="url(#arrowY)"/>
    <text y="5" text-anchor="middle" fill="#f7df1e" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Event</text>
    <text y="22" text-anchor="middle" fill="#f7df1e" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Loop</text>
    <text y="105" text-anchor="middle" fill="#f0c040" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Event Loop</text>
  </g>
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowY" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#f7df1e" stroke-width="1.5"/>
    </marker>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    </marker>
  </defs>
  <!-- Event Queue / Callback Queue -->
  <g transform="translate(660,170)">
    <rect x="-65" y="-55" width="130" height="110" rx="12" fill="none" stroke="url(#queue-g)" stroke-width="2.5" opacity="0.85"/>
    <!-- Queue items -->
    <rect x="-50" y="-40" width="100" height="20" rx="4" fill="#38bdf8" opacity="0.15"/>
    <rect x="-50" y="-14" width="100" height="20" rx="4" fill="#818cf8" opacity="0.15"/>
    <rect x="-50" y="12" width="100" height="20" rx="4" fill="#38bdf8" opacity="0.15"/>
    <text x="0" y="-25" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10">setTimeout cb</text>
    <text x="0" y="1" text-anchor="middle" fill="#818cf8" font-family="monospace" font-size="10">I/O callback</text>
    <text x="0" y="27" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10">Promise.then</text>
    <text y="105" text-anchor="middle" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Event Queue</text>
  </g>
  <!-- Connection arrows -->
  <line x1="190" y1="170" x2="325" y2="170" stroke="#68a063" stroke-width="2" marker-end="url(#arrowY)" opacity="0.6"/>
  <line x1="475" y1="170" x2="590" y2="170" stroke="#f7df1e" stroke-width="2" marker-end="url(#arrowB)" opacity="0.6"/>
  <!-- Call Stack mini -->
  <g transform="translate(265,80)">
    <rect x="-30" y="-20" width="60" height="16" rx="3" fill="#68a063" opacity="0.2"/>
    <rect x="-30" y="-2" width="60" height="16" rx="3" fill="#68a063" opacity="0.15"/>
    <rect x="-30" y="16" width="60" height="16" rx="3" fill="#68a063" opacity="0.1"/>
    <text x="0" y="-8" text-anchor="middle" fill="#68a063" font-family="monospace" font-size="7">main()</text>
    <text x="0" y="10" text-anchor="middle" fill="#68a063" font-family="monospace" font-size="7">readFile()</text>
    <text x="0" y="28" text-anchor="middle" fill="#68a063" font-family="monospace" font-size="7">callback()</text>
    <text x="0" y="52" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10" font-weight="600">Call Stack</text>
  </g>
  <!-- Phases labels -->
  <g transform="translate(400,330)">
    <text x="-200" y="0" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="10" opacity="0.7">Timers</text>
    <text x="-100" y="0" text-anchor="middle" fill="#facc15" font-family="monospace" font-size="10" opacity="0.7">I/O</text>
    <text x="0" y="0" text-anchor="middle" fill="#fb923c" font-family="monospace" font-size="10" opacity="0.7">Poll</text>
    <text x="100" y="0" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="10" opacity="0.7">Check</text>
    <text x="200" y="0" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="10" opacity="0.7">Close</text>
    <!-- Connecting dots -->
    <circle cx="-200" cy="10" r="3" fill="#4ade80" opacity="0.6"/>
    <circle cx="-100" cy="10" r="3" fill="#facc15" opacity="0.6"/>
    <circle cx="0" cy="10" r="3" fill="#fb923c" opacity="0.6"/>
    <circle cx="100" cy="10" r="3" fill="#c084fc" opacity="0.6"/>
    <circle cx="200" cy="10" r="3" fill="#f87171" opacity="0.6"/>
    <line x1="-197" y1="10" x2="197" y2="10" stroke="#475569" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
  </g>
  <!-- Title -->
  <text x="400" y="385" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="14" font-weight="600" opacity="0.6">Event Loop Phases →</text>
  <!-- Glow effects -->
  <circle cx="130" cy="170" r="90" fill="#68a063" opacity="0.03"/>
  <circle cx="400" cy="170" r="90" fill="#f7df1e" opacity="0.03"/>
  <circle cx="660" cy="170" r="90" fill="#38bdf8" opacity="0.03"/>
</svg>
