<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Nested array visual -->
  <g transform="translate(400,180)">
    <!-- Outer brackets -->
    <text x="-240" y="5" fill="#eab308" font-family="monospace" font-size="50" font-weight="700">[</text>
    <text x="210" y="5" fill="#eab308" font-family="monospace" font-size="50" font-weight="700">]</text>
    <!-- Nested elements -->
    <text x="-170" y="0" fill="#94a3b8" font-family="monospace" font-size="18">1,</text>
    <text x="-120" y="0" fill="#38bdf8" font-family="monospace" font-size="18">[</text>
    <text x="-100" y="0" fill="#94a3b8" font-family="monospace" font-size="18">2,</text>
    <text x="-60" y="0" fill="#22c55e" font-family="monospace" font-size="18">[</text>
    <text x="-40" y="0" fill="#94a3b8" font-family="monospace" font-size="18">3, 4</text>
    <text x="20" y="0" fill="#22c55e" font-family="monospace" font-size="18">]</text>
    <text x="40" y="0" fill="#38bdf8" font-family="monospace" font-size="18">]</text>
    <text x="60" y="0" fill="#94a3b8" font-family="monospace" font-size="18">, 5</text>
    <!-- Arrow down -->
    <line x1="0" y1="40" x2="0" y2="80" stroke="#a78bfa" stroke-width="2.5" opacity="0.6"/>
    <polygon points="-8,75 8,75 0,90" fill="#a78bfa" opacity="0.6"/>
    <text x="0" y="70" text-anchor="middle" fill="#a78bfa" font-family="system-ui,sans-serif" font-size="12" font-weight="700">.flat(∞)</text>
    <!-- Flat result -->
    <text x="-100" y="120" fill="#eab308" font-family="monospace" font-size="22" font-weight="700">[</text>
    <text x="-70" y="120" fill="#f8fafc" font-family="monospace" font-size="20">1, 2, 3, 4, 5</text>
    <text x="125" y="120" fill="#eab308" font-family="monospace" font-size="22" font-weight="700">]</text>
  </g>
  <!-- Title hint -->
  <text x="400" y="340" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="14">Array.flat() • reduce • recursion • generator</text>
  <circle cx="400" cy="180" r="160" fill="#eab308" opacity="0.02"/>
</svg>
