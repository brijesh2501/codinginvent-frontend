<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Vite lightning bolt -->
  <g transform="translate(230,185)">
    <polygon points="10,-80 -40,10 0,10 -10,80 40,-10 0,-10" fill="none" stroke="#646cff" stroke-width="2.5" opacity="0.8"/>
    <polygon points="10,-80 -40,10 0,10 -10,80 40,-10 0,-10" fill="#646cff" opacity="0.08"/>
    <text y="120" text-anchor="middle" fill="#646cff" font-family="system-ui,sans-serif" font-size="28" font-weight="800">Vite</text>
    <text y="145" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="12">⚡ 300ms HMR</text>
  </g>
  <!-- VS -->
  <text x="400" y="195" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="32" font-weight="800">VS</text>
  <!-- Webpack cube -->
  <g transform="translate(570,175)">
    <polygon points="0,-65 65,-30 65,30 0,65 -65,30 -65,-30" fill="none" stroke="#8dd6f9" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="-65" x2="0" y2="65" stroke="#8dd6f9" stroke-width="1" opacity="0.3"/>
    <line x1="-65" y1="-30" x2="65" y2="30" stroke="#8dd6f9" stroke-width="1" opacity="0.3"/>
    <line x1="65" y1="-30" x2="-65" y2="30" stroke="#8dd6f9" stroke-width="1" opacity="0.3"/>
    <text y="100" text-anchor="middle" fill="#8dd6f9" font-family="system-ui,sans-serif" font-size="28" font-weight="800">Webpack</text>
    <text y="125" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="12">📦 Battle-tested</text>
  </g>
  <!-- Speed comparison bar -->
  <g transform="translate(130,345)">
    <rect width="250" height="10" rx="5" fill="#646cff" opacity="0.4"/>
    <text x="260" y="10" fill="#646cff" font-family="monospace" font-size="11">Vite: 0.3s</text>
    <rect y="20" width="540" height="10" rx="5" fill="#8dd6f9" opacity="0.25"/>
    <text x="550" y="30" fill="#8dd6f9" font-family="monospace" font-size="11">Webpack: 12s</text>
  </g>
  <circle cx="230" cy="185" r="120" fill="#646cff" opacity="0.03"/>
  <circle cx="570" cy="175" r="120" fill="#8dd6f9" opacity="0.02"/>
</svg>
