<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <g opacity="0.06" stroke="#f59e0b" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="350" x2="800" y2="350"/>
  </g>
  <!-- SQL table icon -->
  <g transform="translate(220,180)">
    <rect x="-90" y="-80" width="180" height="160" rx="12" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0.85"/>
    <line x1="-90" y1="-40" x2="90" y2="-40" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
    <line x1="-90" y1="40" x2="90" y2="40" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
    <line x1="-20" y1="-80" x2="-20" y2="80" stroke="#f59e0b" stroke-width="1.5" opacity="0.3"/>
    <text y="-55" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="16" font-weight="700">SQL</text>
    <text x="-50" y="-15" fill="#94a3b8" font-family="monospace" font-size="11">id</text>
    <text x="30" y="-15" fill="#94a3b8" font-family="monospace" font-size="11">name</text>
    <text x="-50" y="25" fill="#64748b" font-family="monospace" font-size="11">1</text>
    <text x="30" y="25" fill="#64748b" font-family="monospace" font-size="11">Alice</text>
    <text x="-50" y="65" fill="#64748b" font-family="monospace" font-size="11">2</text>
    <text x="30" y="65" fill="#64748b" font-family="monospace" font-size="11">Bob</text>
  </g>
  <!-- VS -->
  <text x="400" y="195" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="32" font-weight="800">VS</text>
  <!-- NoSQL doc icon -->
  <g transform="translate(580,180)">
    <rect x="-90" y="-80" width="180" height="160" rx="12" fill="none" stroke="#22c55e" stroke-width="2.5" opacity="0.85"/>
    <text y="-55" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="16" font-weight="700">NoSQL</text>
    <text x="-65" y="-20" fill="#94a3b8" font-family="monospace" font-size="12">{</text>
    <text x="-50" y="5" fill="#38bdf8" font-family="monospace" font-size="11">"name"</text>
    <text x="20" y="5" fill="#94a3b8" font-family="monospace" font-size="11">: "Alice"</text>
    <text x="-50" y="30" fill="#38bdf8" font-family="monospace" font-size="11">"age"</text>
    <text x="20" y="30" fill="#94a3b8" font-family="monospace" font-size="11">: 28</text>
    <text x="-50" y="55" fill="#38bdf8" font-family="monospace" font-size="11">"tags"</text>
    <text x="20" y="55" fill="#94a3b8" font-family="monospace" font-size="11">: [...]</text>
    <text x="-65" y="75" fill="#94a3b8" font-family="monospace" font-size="12">}</text>
  </g>
  <!-- Glow -->
  <circle cx="220" cy="180" r="120" fill="#f59e0b" opacity="0.03"/>
  <circle cx="580" cy="180" r="120" fill="#22c55e" opacity="0.03"/>
</svg>
