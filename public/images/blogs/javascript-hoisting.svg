<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Hoisting visualization -->
  <g transform="translate(400,190)">
    <!-- Before execution (source code) -->
    <g transform="translate(-160,0)">
      <text y="-120" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Source Code</text>
      <rect x="-110" y="-100" width="220" height="200" rx="12" fill="#eab308" opacity="0.06" stroke="#eab308" stroke-width="1.5"/>
      <text x="-90" y="-70" fill="#94a3b8" font-family="monospace" font-size="12">console.log(x);</text>
      <text x="-90" y="-45" fill="#94a3b8" font-family="monospace" font-size="12">greet();</text>
      <line x1="-100" y1="-30" x2="100" y2="-30" stroke="#475569" stroke-width="0.5"/>
      <text x="-90" y="-5" fill="#eab308" font-family="monospace" font-size="12" font-weight="700">var</text>
      <text x="-50" y="-5" fill="#94a3b8" font-family="monospace" font-size="12">x = 10;</text>
      <text x="-90" y="25" fill="#a78bfa" font-family="monospace" font-size="12" font-weight="700">function</text>
      <text x="-5" y="25" fill="#94a3b8" font-family="monospace" font-size="12">greet() {</text>
      <text x="-70" y="50" fill="#64748b" font-family="monospace" font-size="12">...</text>
      <text x="-90" y="75" fill="#94a3b8" font-family="monospace" font-size="12">}</text>
    </g>
    <!-- Arrow -->
    <line x1="0" y1="0" x2="60" y2="0" stroke="#a78bfa" stroke-width="2.5" opacity="0.5"/>
    <polygon points="55,-6 55,6 70,0" fill="#a78bfa" opacity="0.5"/>
    <text x="35" y="-15" text-anchor="middle" fill="#a78bfa" font-family="system-ui,sans-serif" font-size="11" font-weight="700">HOIST</text>
    <!-- After hoisting (execution) -->
    <g transform="translate(160,0)">
      <text y="-120" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="13" font-weight="700">After Hoisting</text>
      <rect x="-110" y="-100" width="220" height="200" rx="12" fill="#22c55e" opacity="0.06" stroke="#22c55e" stroke-width="1.5"/>
      <text x="-90" y="-70" fill="#eab308" font-family="monospace" font-size="12" font-weight="700">var</text>
      <text x="-50" y="-70" fill="#94a3b8" font-family="monospace" font-size="12">x; // undefined</text>
      <text x="-90" y="-45" fill="#a78bfa" font-family="monospace" font-size="12" font-weight="700">function</text>
      <text x="-5" y="-45" fill="#94a3b8" font-family="monospace" font-size="12">greet(){}</text>
      <line x1="-100" y1="-25" x2="100" y2="-25" stroke="#475569" stroke-width="0.5"/>
      <text x="-90" y="0" fill="#94a3b8" font-family="monospace" font-size="12">console.log(x);</text>
      <text x="-90" y="25" fill="#22c55e" font-family="monospace" font-size="11">// → undefined</text>
      <text x="-90" y="55" fill="#94a3b8" font-family="monospace" font-size="12">greet();</text>
      <text x="-90" y="75" fill="#22c55e" font-family="monospace" font-size="11">// → works!</text>
    </g>
  </g>
  <circle cx="400" cy="190" r="170" fill="#eab308" opacity="0.02"/>
</svg>
